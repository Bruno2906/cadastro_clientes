<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/cadastroClientes.js" defer></script>
</head>
<body>

<h1>Cadastro de Clientes</h1>


<main>

    <div id="conteudo">
        <h2 class="titulo">CADASTRO DE CLIENTES</h2>

        <input type="text" id="nome" placeholder="Nome">
        <input type="email" id="email" placeholder="Email">

        <button id="salvar">Salvar</button>
        <button id="limpar">Limpar</button>
    </div>

    <div id="conteudo_tabela">
        <h2 class="titulo">LISTA DE CLIENTES</h2>

        <table id="resultado">
            <thead>
                <tr class="tabela_titulos">
                    <td>Nome</td>
                    <td>Email</td>
                    <td>Ações</td>
                </tr>
            </thead>
            <tbody id="lista-clientes"></tbody>
        </table>
    </div>

</main>


</body>
</html>
